<?php if (!empty($flashes)): ?>
  <div class="flash-stack">
    <?php foreach ($flashes as $flashType => $flashMessages): ?>
      <?php foreach ((array) $flashMessages as $flashMsg): ?>
        <div class="alert alert-<?= htmlspecialchars($flashType, ENT_QUOTES) ?>">
          <i class="fa-solid <?= $flashType === 'success' ? 'fa-circle-check' : ($flashType === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info') ?>"></i>
          <span><?= htmlspecialchars((string) $flashMsg) ?></span>
        </div>
      <?php endforeach; ?>
    <?php endforeach; ?>
  </div>
<?php endif; ?>
