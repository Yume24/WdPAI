<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Page Not Found · FurEver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@700;800&display=swap" rel="stylesheet">

      <i class="fa-solid fa-gauge-high"></i> Go to Dashboard

    <a href="/home" class="btn btn-outline">
      <i class="fa-solid fa-paw"></i> Browse Animals
    </a>
  </div>

    <i class="fa-solid fa-cat"></i>
